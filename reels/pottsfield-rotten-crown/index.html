<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pottsfield Studio — Rotten Crown (V3 Tight Cut · 60fps)</title>
  <style>
    :root {
      --bg: #060714;
      --card: #101228;
      --violet: #8b5cf6;
      --orange: #ff7508;
      --gold: #fbbf24;
      --bone: #faf5eb;
      --muted: #9ca3c4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 18%, #1d1646 0%, #060714 70%);
      color: var(--bone);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 32px;
      gap: 18px;
    }
    header { text-align: center; max-width: 540px; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.16);
      border: 1px solid rgba(167, 139, 250, 0.45);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--bone);
    }
    p.sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .phone-frame {
      position: relative;
      width: min(92vw, 415px);
      aspect-ratio: 9 / 16;
      border-radius: 26px;
      overflow: hidden;
      background: #000;
      border: 2px solid rgba(139, 92, 246, 0.48);
      box-shadow:
        0 26px 80px rgba(0, 0, 0, 0.88),
        0 0 60px rgba(124, 58, 237, 0.28);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #060714;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    a.btn, button.btn {
      appearance: none;
      cursor: pointer;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: transform 0.15s ease, opacity 0.15s ease;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: var(--card);
      color: var(--bone);
    }
    a.btn.primary, button.btn.primary {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-color: #a78bfa;
      color: #fff;
    }
    a.btn:hover, button.btn:hover { transform: translateY(-1px); opacity: 0.94; }
    .chapters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 560px;
    }
    .chip {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      cursor: pointer;
    }
    .chip:hover { color: #c4b5fd; border-color: rgba(167, 139, 250, 0.55); }
  </style>
</head>
<body>
  <header>
    <span class="badge">Pottsfield Studio · Compressed V3 Reel (8209c58 Template)</span>
    <h1>Driven by Story. Lit by Soul.</h1>
    <p class="sub">1080×1920 · 60fps · 41.2s · SFX-Only Intro → Slowed Hide (CS01) on Rotten Crown</p>
  </header>

  <div class="phone-frame">
    <video
      id="reel"
      src="./pottsfield-rotten-crown.mp4"
      poster="./poster.jpg"
      controls
      playsinline
      preload="metadata"
    >
      <track kind="captions" src="./pottsfield-rotten-crown.srt" srclang="en" label="English" />
    </video>
  </div>

  <div class="actions">
    <button class="btn primary" onclick="playUnmuted()">▶ Play Reel with Sound</button>
    <a class="btn" href="./pottsfield-rotten-crown.mp4" download="Pottsfield-Studio-Rotten-Crown-Tight-Reel.mp4">⬇ Download MP4</a>
  </div>

  <div class="chapters">
    <button class="chip" onclick="seekTo(0)">00:00 Play Store Collage</button>
    <button class="chip" onclick="seekTo(3.27)">00:03 $1 Quintillion</button>
    <button class="chip" onclick="seekTo(8.70)">00:08 [X] Trap</button>
    <button class="chip" onclick="seekTo(10.63)">00:10 Dopamine Spreadsheet</button>
    <button class="chip" onclick="seekTo(13.90)">00:14 Shader Burn → Pottsfield</button>
    <button class="chip" onclick="seekTo(18.17)">00:18 Three Pillars</button>
    <button class="chip" onclick="seekTo(22.82)">00:23 Rotten Crown · Thornfield (Hide Starts)</button>
    <button class="chip" onclick="seekTo(27.65)">00:28 The Silent Watcher</button>
    <button class="chip" onclick="seekTo(30.33)">00:30 Into The Gloaming</button>
    <button class="chip" onclick="seekTo(35.73)">00:36 Driven by Story</button>
  </div>

  <script>
    const v = document.getElementById('reel');
    function playUnmuted() {
      v.muted = false;
      v.currentTime = 0;
      v.play();
    }
    function seekTo(sec) {
      v.muted = false;
      v.currentTime = sec;
      v.play();
    }
  </script>
</body>
</html>
