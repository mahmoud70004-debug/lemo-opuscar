<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pottsfield Studio — Rotten Crown (V4 Nocturnal Dark Fantasy · Seamless Loop · 60fps)</title>
  <style>
    :root {
      --bg: #050611;
      --card: #0e1024;
      --magenta: #b8296b;
      --rose: #e879ae;
      --amber: #f59e0b;
      --bone: #f6f1e9;
      --muted: #9892b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 16%, rgba(184, 41, 107, 0.18) 0%, rgba(20, 18, 52, 0.36) 36%, #050611 76%);
      color: var(--bone);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 34px;
      gap: 18px;
    }
    header { text-align: center; max-width: 540px; }
    .badge {
      display: inline-block;
      padding: 4px 13px;
      border-radius: 999px;
      background: rgba(184, 41, 107, 0.16);
      border: 1px solid rgba(232, 121, 174, 0.38);
      color: var(--rose);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--bone);
    }
    p.sub {
      margin-top: 5px;
      font-size: 13px;
      color: var(--muted);
    }
    .phone-frame {
      position: relative;
      width: min(92vw, 415px);
      aspect-ratio: 9 / 16;
      border-radius: 26px;
      overflow: hidden;
      background: #050611;
      border: 1.5px solid rgba(184, 41, 107, 0.42);
      box-shadow:
        0 28px 84px rgba(0, 0, 0, 0.92),
        0 0 64px rgba(184, 41, 107, 0.22);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #050611;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    a.btn, button.btn {
      appearance: none;
      cursor: pointer;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: transform 0.15s ease, opacity 0.15s ease;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: var(--card);
      color: var(--bone);
    }
    a.btn.primary, button.btn.primary {
      background: linear-gradient(135deg, #9d174d, #4c1d95);
      border-color: rgba(232, 121, 174, 0.65);
      color: #fff;
    }
    a.btn:hover, button.btn:hover { transform: translateY(-1px); opacity: 0.94; }
    .chapters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 580px;
    }
    .chip {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      cursor: pointer;
    }
    .chip:hover { color: var(--rose); border-color: rgba(232, 121, 174, 0.55); }
  </style>
</head>
<body>
  <header>
    <span class="badge">Pottsfield Studio · V4 Nocturnal Dark Fantasy · Infinite Loop</span>
    <h1>Driven by Story. Lit by Soul.</h1>
    <p class="sub">1080×1920 · 60fps · 60.0s Seamless Loop · Slowed + Reverb CS01 Score</p>
  </header>

  <div class="phone-frame">
    <video
      id="reel"
      src="./pottsfield-rotten-crown.mp4"
      poster="./poster.jpg"
      controls
      loop
      playsinline
      preload="metadata"
    >
      <track kind="captions" src="./pottsfield-rotten-crown.srt" srclang="en" label="English" />
    </video>
  </div>

  <div class="actions">
    <button class="btn primary" onclick="playUnmuted()">▶ Play Seamless Loop with Sound</button>
    <a class="btn" href="./pottsfield-rotten-crown.mp4" download="Pottsfield-Studio-Rotten-Crown-V4-Reel.mp4">⬇ Download MP4 (8.3 MB)</a>
  </div>

  <div class="chapters">
    <button class="chip" onclick="seekTo(0)">00:00 Nocturnal Collage</button>
    <button class="chip" onclick="seekTo(5.15)">00:05 Hollow Numbers</button>
    <button class="chip" onclick="seekTo(8.20)">00:08 0.2mm [X] Trap</button>
    <button class="chip" onclick="seekTo(12.30)">00:12 Endless Loop Grid</button>
    <button class="chip" onclick="seekTo(18.10)">00:18 Lost in the Dark</button>
    <button class="chip" onclick="seekTo(21.80)">00:22 Ancient Sky</button>
    <button class="chip" onclick="seekTo(29.65)">00:30 Rotten Crown (Free)</button>
    <button class="chip" onclick="seekTo(37.35)">00:37 Thornfield Rain</button>
    <button class="chip" onclick="seekTo(40.40)">00:40 Silent Watcher</button>
    <button class="chip" onclick="seekTo(48.80)">00:49 Unspoken Loop Finale</button>
  </div>

  <script>
    const v = document.getElementById('reel');
    function playUnmuted() {
      v.muted = false;
      v.loop = true;
      v.currentTime = 0;
      v.play();
    }
    function seekTo(sec) {
      v.muted = false;
      v.loop = true;
      v.currentTime = sec;
      v.play();
    }
  </script>
</body>
</html>
