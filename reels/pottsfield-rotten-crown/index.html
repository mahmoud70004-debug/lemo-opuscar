<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pottsfield Studio — Rotten Crown (V2 Mixed-Media Reel · 1080×1920 · 60fps)</title>
  <style>
    :root {
      --bg: #070609;
      --card: #120f17;
      --orange: #ff7508;
      --gold: #fbbf24;
      --bone: #faf5eb;
      --muted: #9a90a2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 15%, #231109 0%, #070609 68%);
      color: var(--bone);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 32px;
      gap: 18px;
    }
    header { text-align: center; max-width: 500px; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 117, 8, 0.14);
      border: 1px solid rgba(255, 117, 8, 0.45);
      color: var(--orange);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--bone);
    }
    p.sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .phone-frame {
      position: relative;
      width: min(92vw, 415px);
      aspect-ratio: 9 / 16;
      border-radius: 26px;
      overflow: hidden;
      background: #000;
      border: 2px solid rgba(255, 117, 8, 0.42);
      box-shadow:
        0 26px 80px rgba(0, 0, 0, 0.85),
        0 0 55px rgba(255, 117, 8, 0.22);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #070609;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    a.btn, button.btn {
      appearance: none;
      cursor: pointer;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: transform 0.15s ease, opacity 0.15s ease;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: var(--card);
      color: var(--bone);
    }
    a.btn.primary, button.btn.primary {
      background: linear-gradient(135deg, #ff7508, #c83214);
      border-color: #ff9436;
      color: #fff;
    }
    a.btn:hover, button.btn:hover { transform: translateY(-1px); opacity: 0.94; }
    .chapters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 520px;
    }
    .chip {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      cursor: pointer;
    }
    .chip:hover { color: var(--gold); border-color: rgba(251, 191, 36, 0.45); }
  </style>
</head>
<body>
  <header>
    <span class="badge">Pottsfield Studio · Official V2 Mixed-Media Reel (9:16 · 60fps)</span>
    <h1>Driven by Story. Lit by Soul.</h1>
    <p class="sub">1080×1920 · 60fps · Real Footage + 2.5D VFX · Trailer Audio (-14 LUFS)</p>
  </header>

  <div class="phone-frame">
    <video
      id="reel"
      src="./pottsfield-rotten-crown.mp4"
      poster="./poster.jpg"
      controls
      playsinline
      preload="metadata"
    >
      <track kind="captions" src="./pottsfield-rotten-crown.srt" srclang="en" label="English" />
    </video>
  </div>

  <div class="actions">
    <button class="btn primary" onclick="playUnmuted()">▶ Play Reel with Sound</button>
    <a class="btn" href="./pottsfield-rotten-crown.mp4" download="Pottsfield-Studio-Rotten-Crown-V2-Reel.mp4">⬇ Download MP4</a>
  </div>

  <div class="chapters">
    <button class="chip" onclick="seekTo(0)">00:00 Play Store Brainrot</button>
    <button class="chip" onclick="seekTo(4.82)">00:05 Idle Quintillion</button>
    <button class="chip" onclick="seekTo(8.97)">00:09 Fake Ads &amp; [X] Sniper</button>
    <button class="chip" onclick="seekTo(13.48)">00:13 Excel Clown Suit</button>
    <button class="chip" onclick="seekTo(16.95)">00:17 Shatter → Pottsfield</button>
    <button class="chip" onclick="seekTo(21.14)">00:21 Craft &amp; Worlds</button>
    <button class="chip" onclick="seekTo(26.72)">00:27 Rotten Crown Reveal</button>
    <button class="chip" onclick="seekTo(36.86)">00:37 Driven by Story</button>
  </div>

  <script>
    const v = document.getElementById('reel');
    function playUnmuted() {
      v.muted = false;
      v.currentTime = 0;
      v.play();
    }
    function seekTo(sec) {
      v.muted = false;
      v.currentTime = sec;
      v.play();
    }
  </script>
</body>
</html>
